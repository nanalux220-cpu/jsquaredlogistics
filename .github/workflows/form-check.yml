name: form-check
on:
  push:
    branches: [claude/project-thread-pnj5c6]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mail records
        run: |
          echo "MX:"; dig +short MX jsquaredlogistics.co.uk
          echo "A:"; dig +short A jsquaredlogistics.co.uk
      - name: Live site
        run: |
          for u in https://jsquaredlogistics.vercel.app https://jsquaredlogistics-nanalux220-cpus-projects.vercel.app; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' -L $u)"
          done
          curl -sL https://jsquaredlogistics.vercel.app | grep -o '<title>[^<]*' || true
      - name: Test enquiry
        run: |
          curl -s -X POST https://formsubmit.co/ajax/admin@jsquaredlogistics.co.uk \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -H 'Origin: https://jsquaredlogistics.vercel.app' -H 'Referer: https://jsquaredlogistics.vercel.app/' \
            -d '{"_subject":"Test enquiry from your website","_template":"table","_captcha":"false","name":"Website test","email":"admin@jsquaredlogistics.co.uk","service":"Not sure yet","message":"This is a test sent to check the contact form works. If this email asks you to activate the form, click the activation button and every enquiry after that will arrive here."}'
          echo
